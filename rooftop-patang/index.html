<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rooftop Patang</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --me: #c8325a; --them: #2a6fb0; }
  body.night { --ink: #efe9df; --muted: #a29fb6; --me: #f06a8a; --them: #6aa8ea; }
  /* the bottom line sits over the sunset glow, so it gets brighter text with a soft shadow */
  body.night #bottom { --muted: #f6efe6; text-shadow: 0 1px 3px rgba(24, 16, 34, .7); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: crosshair; outline: none; }
  #top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 4px; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row b { font-size: 16px; font-weight: 600; min-width: 1ch; font-variant-numeric: tabular-nums; }
  .label { color: var(--muted); }
  .cells { display: flex; gap: 3px; }
  .cells i { width: 6px; height: 6px; background: currentColor; }
  .cells i.off { opacity: .16; }
  #me { color: var(--me); } #them { color: var(--them); }
  #pech[hidden] { display: none; }
  #saw0 { color: var(--me); } #saw1 { color: var(--them); }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); align-items: flex-end; }
  #status { color: var(--muted); }
  .buttons { display: flex; gap: 24px; }
  button { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Three houses with rooftop terraces on a kite festival afternoon. Hold to pull your kite towards the pointer, let go to give it string. Space and the arrow keys work too."></canvas></div>
<div id="top">
  <div class="row" id="me"><b id="s0">0</b><span class="cells" id="d0"></span><span class="label">you</span></div>
  <div class="row" id="them"><b id="s1">0</b><span class="cells" id="d1"></span><span class="label" id="mood">neighbours</span></div>
  <div class="row"><span class="label" id="loot"></span></div>
  <div class="row"><span class="label" id="wind"></span></div>
  <div class="row" id="pech" hidden><span class="cells" id="saw0"></span><span class="cells" id="saw1"></span><span class="label">pech!</span></div>
</div>
<div class="hud" id="bottom">
  <div id="status" role="status" aria-live="polite"></div>
  <div class="buttons"><button id="mute" type="button" aria-pressed="false">sound on</button></div>
</div>
<script src="../shell.js"></script>
<script>
PixelPlays.mount({
  id: 'rooftop-patang',
  rules: [
    'It is kite festival day. Cut the neighbours\' kites before they cut yours. Make 3 cuts to win the day; get cut 3 times and they do.',
    'Hold to pull: your kite turns towards your finger or cursor and climbs. Let go to give it string: it rides the wind further and further out. Keyboard: hold space to pull, arrows to steer.',
    'Cross your string over another to start a pech. Pulling hard cuts, and so does letting string run out fast, the dheel. A string that just hangs there loses.',
    'Next door and the back roof have moods: they come after you, keep away, just fly, or go after each other. You can join their fights.',
    'When a cut kite drifts low over your terrace, your little brother runs to catch it. Every kite he loots goes on your stash.',
    'Pull your kite down into the rooftops and it is lost. The day turns to night as the fight goes on.',
  ],
});
</script>
<script>window.PP_SCENE = { originY: 52, height: 330, zoom: 12, shadowX: .9, shadowY: -.5 };</script>
<script src="../engine.js"></script>
<script>
'use strict';

/* ---------- layout ---------- */
// x runs screen down-right, y runs screen down-left, z is up, 0 is our roof.
// Our house has two floors under its terrace; next door has three; the house behind, across the lane, has two
const FH = 2.4, RISE = FH, STREET = -2 * FH, SPLIT = -.4;
const OURS = { x0: -7, x1: 6.5, y0: SPLIT, y1: 7.2 };
const NEXT = { x0: -7, x1: 6.5, y0: -7.2, y1: SPLIT };
const BACK = { x0: -13.4, x1: -7.6, y0: -7.2, y1: -1.2 };
const HELPER = { x: -.4, y: 4.6 };
const MUMTY = { x0: -6.6, y0: SPLIT + .15, x1: -4.2, y1: 2.6, h: 2.5 }; // the stair room, with the water tank on top
const LINE_A = [-6.2, 6.4], LINE_B = [-3.1, 3.3], LINE_Z = 1.65; // our clothesline, running across the view
const WIN = 3;
// a kite that sinks below its flyer's hands has come down among the roofs
const floorOf = k => k.hy - 12;

/* ---------- palette ---------- */
const TILE = [[226, 220, 206], [218, 212, 198], [232, 226, 214]], GROUT = [196, 188, 174];
const CONCRETE = [[176, 170, 160], [184, 178, 168], [192, 186, 176]], TAR = [[70, 66, 66], [80, 76, 74]];
const NEXT_PAINT = [150, 196, 188], DOOR_WOOD = [118, 62, 42];
const TRIM = [236, 230, 214], CAP = [204, 196, 182], CHAJJA = [196, 190, 178];
const MUMTY_C = [214, 196, 168], DOOR = [96, 66, 48], TANK = [40, 40, 44], BLUE_TANK = [60, 112, 168];
const POT = [176, 92, 58], TULSI = [[44, 92, 48], [70, 120, 56]];
const LEAF_C = [[34, 70, 44], [52, 96, 52], [86, 126, 62], [126, 152, 72]];
const BOY = { shirt: [232, 196, 64], stripe: [232, 196, 64], legs: [52, 58, 92], hair: [30, 24, 22], skin: [176, 118, 82] };
const KID = { shirt: [120, 168, 96], stripe: [236, 232, 220], legs: [70, 66, 60], knee: .8, hair: [26, 22, 20], skin: [182, 124, 88] };
const RIVAL_C = { shirt: [64, 112, 176], stripe: [236, 234, 228], legs: [58, 52, 46], hair: [24, 20, 18], skin: [160, 108, 76] };
const BACK_C = { shirt: [196, 70, 60], stripe: [240, 226, 200], legs: [70, 60, 50], hair: [28, 22, 20], skin: [168, 112, 78] };
const CLOTHES = [[198, 58, 82], [240, 236, 224], [64, 120, 176], [236, 176, 40]];
const MANJA = [rgb(214, 70, 120), rgb(40, 140, 96), rgb(210, 150, 40)];
const FAR_KITES = [[rgb(240, 120, 40), rgb(250, 220, 90)], [rgb(120, 60, 160), rgb(240, 200, 220)], [rgb(30, 150, 120), rgb(240, 240, 230)], [rgb(220, 40, 40), rgb(40, 40, 40)], [rgb(250, 200, 30), rgb(60, 120, 200)]];
const WHITE = rgb(255, 255, 255), BAMBOO = rgb(110, 84, 60), GLASS = rgb(58, 52, 58), GRILL = rgb(34, 32, 36);
// every kite in the sky is one of these designs, in a pair of these colours
const DESIGNS = [['dhaal', 'dhaal'], ['patta', 'patta'], ['chaandtara', 'chaand-tara'], ['aankh', 'aankh']];
const COLOURS = [[214, 44, 78], [250, 212, 64], [38, 104, 178], [244, 244, 236], [70, 150, 90], [240, 120, 40], [120, 60, 160], [36, 34, 40]];

/* ---------- the flyers ---------- */
const FLYERS = [
  { at: { x: 1.6, y: 3.2 }, base: 0, look: BOY, scale: .85, name: 'you', their: 'your' },
  { at: { x: 2.4, y: -3.6 }, base: RISE, look: RIVAL_C, scale: .9, name: 'next door', their: 'next door\'s' },
  { at: { x: -11.2, y: -5.3 }, base: 0, look: BACK_C, scale: .85, name: 'the back roof', their: 'the back roof\'s' },
];

/* ---------- the terraces ---------- */
const inRect = (r, x, y) => x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1;
function pick(tones, v, ix, iy) {
  return rgb(...tones[clamp(Math.floor(v * tones.length + (bayerAt(ix, iy) - .5) * .6), 0, tones.length - 1)]);
}
// ours: broken white china tiles set in grout, the kind laid on terraces to keep them cool
function ourRoof(x, y, ix, iy) {
  const jx = x * 2.4 + noise(x * 1.6, y * 1.6) * .9, jy = y * 2.4 + noise(y * 1.6 + 9, x * 1.6) * .9;
  const fx = jx - Math.floor(jx), fy = jy - Math.floor(jy);
  if (fx < .14 || fy < .14) return rgb(...GROUT);
  const stain = noise(x * .6 + 4, y * .6) > .7 ? .25 : 0;
  return pick(TILE, hash(Math.floor(jx), Math.floor(jy)) - stain, ix, iy);
}
// the others: plain concrete with patches of tar where the roof leaked
function theirRoof(x, y, ix, iy) {
  if (noise(x * .7 + 11, y * .7) > .68) return pick(TAR, noise(x * 3, y * 3), ix, iy);
  return pick(CONCRETE, .3 + (noise(x * 1.1, y * 1.1) - .5) * .9 + (hash(ix, iy) - .5) * .2, ix, iy);
}
function bakeGround() {
  const lift = RISE * COS * S;
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const i = iy * W + ix, up = unproject(ix + .5, iy + .5 + lift);
    if (inRect(NEXT, up.x, up.y)) {
      pix[i] = theirRoof(up.x, up.y, ix, iy); ground[i] = 1;
      zb[i] = (up.x + up.y) / R2 * COS + RISE * SIN;
      continue;
    }
    const g = unproject(ix + .5, iy + .5);
    if (inRect(OURS, g.x, g.y) || inRect(BACK, g.x, g.y)) {
      pix[i] = inRect(OURS, g.x, g.y) ? ourRoof(g.x, g.y, ix, iy) : theirRoof(g.x + 30, g.y, ix, iy); ground[i] = 1;
      zb[i] = (g.x + g.y) / R2 * COS;
    }
  }
}

/* ---------- the houses ---------- */
// the pixels of every window pane, so they can light up when night falls
const lamps = [];
let paintingOpening = null;
// one wall, painted point by point; walls that reach the street dissolve into it
function facade(axis, at, a0, a1, z0, z1, wall) {
  const tone = axis === 'x' ? 1.45 : 2.55; // walls turned from the light are darker
  for (let a = a0; a <= a1; a += .045) for (let z = z0; z <= z1; z += .045) {
    const x = axis === 'x' ? at : a, y = axis === 'x' ? a : at, p = project(x, y, z), ix = p.sx | 0, iy = p.sy | 0;
    if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;
    if (z0 === STREET && z - z0 < .6 && bayerAt(ix, iy) > (z - z0) / .6) continue;
    const i = iy * W + ix;
    if (p.d <= zb[i]) continue;
    zb[i] = p.d;
    paintingOpening = null;
    const c = pix[i] = wallLook(wall, a - a0, z - STREET, tone, ix, iy);
    const o = paintingOpening;
    // some rooms will have their lights on tonight, some won't
    if (c === GLASS && o && o.kind !== 'vent' && hash(o.u0 * 7 + at, o.h0 * 3) > .3) lamps.push(i);
  }
  // concrete sunshades over the doors and windows
  for (const o of wall.openings) {
    if (!o.shade) continue;
    const [px, py, pz] = onWall(axis, at, a0, o.u0 - .22, o.h1, 0), [qx, qy, qz] = onWall(axis, at, a0, o.u1 + .22, o.h1 + .1, .36);
    box(Math.min(px, qx), Math.min(py, qy), pz, Math.max(px, qx), Math.max(py, qy), qz, CHAJJA, o.u0 * 7 | 0);
  }
}
// a point on a wall: u along it, h above the street, out away from it
function onWall(axis, at, a0, u, h, out) {
  return axis === 'x' ? [at + out, a0 + u, STREET + h] : [a0 + u, at + out, STREET + h];
}
// bare brick, for next door's newest floor that never got plastered
const BRICKS = [[170, 86, 60], [180, 98, 66], [158, 80, 56]], MORTAR = [190, 172, 150];
function brick(u, h) {
  const row = Math.floor(h / .22), fu = (u + (row % 2) * .25) / .5, col = Math.floor(fu);
  if (h / .22 - row < .22 || fu - col < .1) return MORTAR;
  return BRICKS[hash(col, row) * 3 | 0];
}
// an ordinary house wall: limewash over brick with a darker plinth, damp stains, and only the
// openings the rooms behind it need. Under each sunshade the wall sits in a strip of shadow
function wallLook(wall, u, h, tone, ix, iy) {
  const level = dz => clamp(Math.floor(tone + dz + (bayerAt(ix, iy) - .5) * .5), 0, 4);
  for (const o of wall.openings) {
    if (u >= o.u0 && u <= o.u1 && h >= o.h0 && h <= o.h1) { paintingOpening = o; return openingLook(o, u, h, level); }
  }
  let shade = 0;
  for (const o of wall.openings) {
    if (o.shade && u > o.u0 - .22 && u < o.u1 + .22 && h < o.h1 && h > o.h1 - .32) shade = -1;
    if (o.balcony && u > o.u0 && u < o.u1 && h < o.h0 && h > o.h0 - .45) shade = -1.2;
  }
  for (const r of wall.bare || []) {
    if (u >= r.u0 && u <= r.u1 && h >= r.h0 && h <= r.h1) return rampOf(brick(u, h))[level(shade)];
  }
  if (wall.brickAbove != null && h >= wall.brickAbove) return rampOf(brick(u, h))[level(shade)];
  if (h < .55) return rampOf(wall.plinth)[level(shade - .2)];
  const damp = noise(u * 1.8, h * .5) > .7 || (h < 1.4 && noise(u * 3, 7) > .6) ? -.7 : 0;
  return rampOf(wall.paint)[level(shade + damp + (noise(u * .7, h * .7) - .5) * .35)];
}
function openingLook(o, u, h, level) {
  const du = Math.min(u - o.u0, o.u1 - u), dh = Math.min(h - o.h0, o.h1 - h);
  const trim = rampOf(TRIM), wood = rampOf(o.color || DOOR_WOOD);
  if (o.kind === 'hole') return ((u - o.u0) * 4.5 | 0) % 2 === 0 && du > .08 ? GRILL : GLASS; // no frame yet
  if (o.kind === 'plate') return dh > .06 && du > .06 && (h - o.h0) / (o.h1 - o.h0) > .45 && (h - o.h0) / (o.h1 - o.h0) < .6 ? trim[3] : rgb(70, 52, 40);
  if (du < .08 || dh < .08) return trim[level(.2)];
  if (o.kind === 'vent') return ((h - o.h0) * 16 | 0) % 2 ? GLASS : trim[level(-.6)];
  if (o.kind === 'door') {
    const panel = Math.abs(h - (o.h0 + o.h1) / 2) < .05 || Math.abs(u - (o.u0 + o.u1) / 2) < .04;
    return wood[level(panel ? -1.2 : -.5 + ((u * 8 | 0) % 2) * .3)];
  }
  // a window: iron bars in front, one wooden shutter pulled to, the room dark behind the other
  if (((u - o.u0) * 4.5 | 0) % 2 === 0 && du > .1) return GRILL;
  if (Math.abs(h - (o.h0 + o.h1) / 2) < .04) return GRILL;
  return u < (o.u0 + o.u1) / 2 ? wood[level(-.3 + ((h * 9 | 0) % 2) * .25)] : GLASS;
}
// our street front, along x: the main door with a nameplate, a couple of windows, and the balcony upstairs
const OUR_FRONT = {
  paint: [248, 214, 150], plinth: [150, 86, 70],
  openings: [
    { kind: 'door', u0: 2.4, u1: 3.5, h0: .12, h1: 2.05, shade: true, color: [118, 62, 42] },
    { kind: 'plate', u0: 3.75, u1: 4.15, h0: 1.35, h1: 1.62 },
    { kind: 'window', u0: 5.4, u1: 6.7, h0: .85, h1: 1.95, shade: true, color: [70, 124, 96] },
    { kind: 'window', u0: 10.4, u1: 11.3, h0: 1, h1: 1.8, shade: true, color: [70, 124, 96] },
    { kind: 'door', u0: 2.9, u1: 3.9, h0: 2.55, h1: 4.4, color: [70, 124, 96], balcony: true },
    { kind: 'window', u0: 5, u1: 6.1, h0: 3.25, h1: 4.35, color: [70, 124, 96] },
    { kind: 'window', u0: 9.9, u1: 11.1, h0: 3.25, h1: 4.35, shade: true, color: [70, 124, 96] },
  ],
  bare: [{ u0: 12.2, u1: 13.1, h0: .6, h1: 1.2 }], // where the plaster has come away
};
// our side wall onto the lane: blank, but for a ventilator, the window with the cooler, and the meter
const OUR_SIDE = {
  paint: [244, 208, 144], plinth: [150, 86, 70],
  openings: [
    { kind: 'vent', u0: 2.6, u1: 3.1, h0: 1.75, h1: 2.1 },
    { kind: 'window', u0: 4.4, u1: 5.3, h0: 3.3, h1: 4.25, shade: true, color: [70, 124, 96] },
    { kind: 'vent', u0: 1.8, u1: 2.3, h0: 4.1, h1: 4.45 },
  ],
  bare: [{ u0: 5.8, u1: 6.9, h0: .55, h1: 1.25 }],
};
// next door: plastered on the first two floors, the top floor added later and left in bare brick
const NEXT_SIDE = {
  paint: [156, 198, 190], plinth: [110, 120, 126], brickAbove: 2 * FH,
  openings: [
    { kind: 'vent', u0: 1.2, u1: 1.65, h0: 1.7, h1: 2.05 },
    { kind: 'window', u0: 3.6, u1: 4.7, h0: .85, h1: 1.95, shade: true, color: [64, 100, 150] },
    { kind: 'window', u0: 2.2, u1: 3.4, h0: 3.25, h1: 4.35, shade: true, color: [64, 100, 150] },
    { kind: 'hole', u0: 3.1, u1: 3.95, h0: 5.75, h1: 6.6 },
  ],
};
const NEXT_PARTY = { paint: NEXT_PAINT, plinth: NEXT_PAINT, brickAbove: 0, openings: [{ kind: 'vent', u0: 9.4, u1: 9.85, h0: 6.3, h1: 6.65 }] };
// the house behind, across the lane: pale pink, a door and a couple of windows
const BACK_FRONT = {
  paint: [232, 188, 180], plinth: [130, 92, 90],
  openings: [
    { kind: 'door', u0: 1, u1: 1.9, h0: .12, h1: 2.05, shade: true, color: [70, 100, 140] },
    { kind: 'window', u0: 3.4, u1: 4.5, h0: .9, h1: 1.95, shade: true, color: [70, 100, 140] },
    { kind: 'window', u0: 1.6, u1: 2.7, h0: 3.3, h1: 4.35, shade: true, color: [70, 100, 140] },
    { kind: 'window', u0: 4.2, u1: 5, h0: 3.4, h1: 4.2, color: [70, 100, 140] },
  ],
};
function wallBits() {
  // the first-floor balcony on our front: a slab, an iron railing, a towel drying and a pot
  const y = OURS.y1, x0 = OURS.x0 + 2, x1 = OURS.x0 + 6.9, z = STREET + FH, out = .85;
  box(x0, y, z - .14, x1, y + out, z + .02, CHAJJA, 21);
  const rail = rgb(44, 42, 46);
  for (let x = x0 + .05; x <= x1; x += .2) for (let h = 0; h < .9; h += .04) plot(x, y + out - .04, z + h, rail);
  for (let yy = y; yy <= y + out; yy += .2) for (let h = 0; h < .9; h += .04) { plot(x0 + .02, yy, z + h, rail); plot(x1 - .02, yy, z + h, rail); }
  for (let x = x0; x <= x1; x += .03) { plot(x, y + out - .04, z + .9, rail); plot(x, y + out - .04, z + .45, rail); }
  for (let x = x0 + 2.6; x < x0 + 3.3; x += .03) for (let h = .25; h < .95; h += .03) plot(x, y + out, z + h, rgb(226, 88, 70)); // a towel
  box(x1 - .55, y + .2, z, x1 - .2, y + .55, z + .3, POT, 4);
  for (let k = 0; k < 6; k++) sphere(x1 - .37 + (hash(k, 1) - .5) * .3, y + .37 + (hash(k, 2) - .5) * .3, z + .45 + hash(k, 3) * .25, .12, TULSI[k % 2], 'rough');
  // on our side wall: a desert cooler in the window, and the electricity meter by the ground
  const sx = OURS.x1, sy = OURS.y0;
  box(sx, sy + 4.3, STREET + 3.15, sx + .55, sy + 5.4, STREET + 4.05, [200, 194, 176], 22);
  for (let yy = sy + 4.4; yy < sy + 5.3; yy += .045) for (let h = 3.3; h < 3.95; h += .12) plot(sx + .56, yy, STREET + h, rgb(150, 144, 128));
  box(sx, sy + 1, STREET + 1.15, sx + .14, sy + 1.55, STREET + 1.85, [118, 124, 130], 23);
  // wires sagging from the meter up to the roof
  for (let t = 0; t <= 1; t += .01) plot(sx + .05, sy + 1.27 + t * 2, STREET + 1.85 + t * (2 * FH - 1.7) - Math.sin(t * Math.PI) * .4, rgb(40, 38, 40));
}
function parapet(x0, y0, x1, y1, z, color, seed) {
  box(x0, y0, z, x1, y1, z + .6, color, seed);
  box(x0 - .03, y0 - .03, z + .6, x1 + .03, y1 + .03, z + .7, CAP, seed + 1);
  const along = x1 - x0 > y1 - y0;
  for (let t = 0; t <= 1; t += .04) castShadow(along ? lerp(x0, x1, t) : (x0 + x1) / 2, along ? (y0 + y1) / 2 : lerp(y0, y1, t), z + .65, .22);
}
function buildHouses() {
  facade('y', BACK.y1, BACK.x0, BACK.x1, STREET, 0, BACK_FRONT);
  facade('y', OURS.y1, OURS.x0, OURS.x1, STREET, 0, OUR_FRONT);
  facade('x', OURS.x1, OURS.y0, OURS.y1, STREET, 0, OUR_SIDE);
  facade('x', NEXT.x1, NEXT.y0, NEXT.y1, STREET, RISE, NEXT_SIDE);
  // the part of their wall that rises above our terrace: their new floor, in bare brick
  facade('y', SPLIT, NEXT.x0, NEXT.x1, 0, RISE, NEXT_PARTY);

/* ---------- loop ---------- */

function update(dt) {
  G.time += dt; G.timer += dt;

  if (G.statusUntil && G.time > G.statusUntil) setStatus('');
  // the wind drifts round to a new strength and direction now and then
  if ((G.windT -= dt) <= 0) { G.windT = 35 + Math.random() * 30; G.windTarget = newWind(); }
  G.wind = lerp(G.wind, G.windTarget, Math.min(1, dt * .35));
  const me = G.kites[0];
  // you can fly your kite the whole time; a launching kite flies itself
  for (const k of G.kites) {
    if (k.state !== 'fly') { k.pulling = false; continue; }
    if (!k.launching && k.calm > 0) k.calm -= dt;
    if (k.launching) {
      k.pulling = true; k.steer = null;
      if ((k.launchT += dt) > 2.6 || k.y < k.hy - 120) k.launching = false;
    } else if (k === me) {
      me.pulling = G.holding;
      me.steer = G.aimAt ? null : G.keys.right - G.keys.left;
      if (G.aimAt) aim(me, G.aimAt.x, G.aimAt.y);
    } else botThink(k, dt);

  for (let s = 0; s < 3; s++) for (const k of G.kites) stepKite(k, dt / 3);
  for (const k of G.loose) if (!G.kites.includes(k)) stepKite(k, dt);
  // whoever lost a kite sends a new one up
  G.kites.forEach((k, side) => { if (k.state !== 'fly' && (G.relaunch[side] -= dt) <= 0) G.kites[side] = launchKite(side); });
  for (const k of G.kites) if (flying(k) && k.y > floorOf(k)) cutKite(k, null, 'dip', null);
  updatePechs(dt);
  updateBrother(dt);
  G.limp = G.limp.filter(l => (l.t += dt) < 1.6);
  G.sparks = G.sparks.filter(s => (s.t += dt) < .25);
  G.loose = G.loose.filter(k => k.x > -30 && k.x < W + 30 && k.y < H + 30);

  G.flock += dt;

  updateNight(dt);
  updateAudio(dt);
  renderHud();
}

  windBed = loopNoise(420, .7, 'lowpass', .03);
  const lfo = audio.createOscillator(), depth = audio.createGain();
  lfo.frequency.value = .08; depth.gain.value = .018;
  lfo.connect(depth).connect(windBed.gain.gain); lfo.start();
  rasp = loopNoise(3400, 3, 'bandpass', 0);
}
function updateAudio(dt) {
  if (!audio) return;
  const now = audio.currentTime, me = G.kites[0];
  windBed.filter.frequency.setTargetAtTime(300 + Math.abs(G.wind) * 9, now, .5);
  // the wind recording has one gust and then dies away, so overlapping slices of it, each faded in
  // and out, make a breeze that never stops, louder when the wind is strong
  if (samples.wind && (G.windGrainT -= dt) <= 0) {
    G.windGrainT = 2.6 + Math.random() * 1.4;
    bus = busFor((Math.random() - .5) * .8);
    play('wind', { offset: .3 + Math.random() * 3, dur: 4.4, fadeIn: 1.4, vol: clamp(Math.abs(G.wind) / 26, .45, 1.3) });
  }
  let busy = 0;
  for (const p of G.pechs.values()) busy += (p.a.pulling || p.a.paying) + (p.b.pulling || p.b.paying);
  rasp.gain.gain.setTargetAtTime(G.pechs.size ? .025 + .03 * Math.min(busy, 2) : 0, now, .05);
  // the paper rattles while you pull
  G.flutterT -= dt;
  if (me.pulling && me.state === 'fly' && G.flutterT <= 0) {
    G.flutterT = .07 + Math.random() * .05;
    bus = busFor(panX(me.x));
    hiss(.05, .018, 1500 + Math.random() * 700, 2.5, 'bandpass', 0, .005);
  }
}
function sound(kind, amount = .6, pan = 0) {
  if (!audio) return;
  bus = busFor(pan);
  if (kind === 'pech') { hiss(.18, .05, 3000, 2); tone(1400, 1100, .05, .03, 'square'); }
  else if (kind === 'snap') { tone(2400, 700, .06, .12, 'square'); hiss(.08, .08, 4000, 1.5, 'bandpass', 0, .003); }
  else if (kind === 'cheer') {
    // the roofs around erupt: "kai po che!", a crowd swell, whistles and a pipudi toot
    bus = busFor(pan * .5);
    play('kaipoche');
    bus = busFor(pan, 1);
    if (!play('cheer', { offset: .6, dur: 3.4, fadeIn: .15 })) hiss(1.6, .09, 1000, .6, 'bandpass', 0, .3);
    if (!play('whistle', { when: .4, dur: 2 })) for (let k = 0; k < 3; k++) tone(1900 + k * 160, 2500, .22, .035, 'sine', .15 + k * .2);
    bus = busFor(-pan * .5);
    tone(520, 540, .45, .05, 'sawtooth', .3); tone(530, 470, .35, .05, 'sawtooth', .8);
  }
  else if (kind === 'farcheer') {
    bus = busFor(pan, 2);
    if (!play('cheer', { offset: 1.4, dur: 2.6, vol: .5, rate: .95, fadeIn: .3 })) hiss(1.2, .05, 900, .6, 'bandpass', 0, .3);
  }
  else if (kind === 'lost') { tone(330, 190, .6, .07, 'sawtooth'); hiss(.6, .03, 600, 1, 'lowpass'); }
  else if (kind === 'loot') { tone(660, 990, .1, .07, 'triangle'); tone(990, 1320, .14, .06, 'triangle', .09); tone(880, 1760, .25, .04, 'sine', .2); }
  else if (kind === 'boom') {
    bus = busFor(pan, 2);
    const fw = samples.fireworks;
    if (!fw || !play('fireworks', { offset: 2 + Math.random() * Math.max(0, fw.duration - 5), dur: 1.8, vol: .7, fadeIn: .05 })) {
      tone(90, 40, .5, .12); hiss(.6, .04, 2500, .8, 'bandpass', .12);
    }
  }
  else if (kind === 'win') [523, 659, 784, 1046].forEach((f, k) => tone(f, f * 1.002, .32, .07, 'triangle', k * .13));
  else if (kind === 'lose') [392, 330, 262].forEach((f, k) => tone(f, f * .98, .4, .06, 'triangle', k * .18));
}
const muteButton = document.getElementById('mute');
muteButton.addEventListener('click', () => {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 1;
  muteButton.textContent = muted ? 'sound off' : 'sound on';
  muteButton.setAttribute('aria-pressed', String(muted));
});
document.addEventListener('visibilitychange', () => {
  if (!audio) return;
  if (document.hidden) audio.suspend(); else audio.resume();
});

/* ---------- boot ---------- */
addEventListener('resize', fit);
fit();
bake();
newSky();
G.windTarget = G.wind = newWind();
newMatch();
let last = performance.now();
function frame(now) {
  update(Math.min(.04, (now - last) / 1000));
  last = now;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__patang = { G, newMatch, step(dt, skipDraw) { update(dt); if (!skipDraw) draw(); } };
</script>
