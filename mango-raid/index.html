<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mango Raid</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --ripe: #d98a1c; --noise: #b5392b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }
  #top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 4px; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row b { font-size: 16px; font-weight: 600; min-width: 2ch; font-variant-numeric: tabular-nums; color: var(--ripe); }
  .label { color: var(--muted); }
  .cells { display: flex; gap: 3px; }
  .cells i { width: 6px; height: 6px; background: currentColor; }
  .cells i.off { opacity: .16; }
  #stones { color: #6f6a62; }
  #noise { color: var(--noise); }
  #dogm { color: #9a6a3a; }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); align-items: flex-end; }
  #status { color: var(--muted); }
  button { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="A mango tree in a walled yard, its owner asleep on a charpai. Drag back and release to throw a stone, or use arrow keys and space."></canvas></div>
<div id="top">
  <div class="row"><b id="score">0</b><span class="label">points</span></div>
  <div class="row"><span class="cells" id="stones"></span><span class="label">stones</span></div>
  <div class="row"><span class="cells" id="noise"></span><span class="label" id="noise-label">uncle asleep</span></div>
  <div class="row"><span class="cells" id="dogm"></span><span class="label" id="dog-label">dog asleep</span></div>
</div>
<div class="hud" id="bottom">
  <div id="status" role="status" aria-live="polite"></div>
  <button id="mute" type="button" aria-pressed="false">sound on</button>
</div>
<script src="../shell.js"></script>
<script>
PixelPlays.mount({
  id: 'mango-raid',
  rules: [
    'Uncle is napping under his mango tree. Knock down as many mangoes as you can before your stones run out.',
    'Drag back and release to throw. A longer pull throws harder and higher. Keyboard: left and right to aim, up and down for power, space to throw.',
    'Ripe yellow mangoes are worth 3, raw green ones 1. Your little sister collects whatever falls.',
    'Every noise counts: the trunk, the wall, anything near the charpai. If the noise bar fills, uncle wakes up and you run with whatever is in the basket.',
    'Mind the crow on the wall. Startle it and it flies off cawing, and uncle hears that too.',
    'A dog sleeps under the tree. Anything landing near it makes it lift its head and listen; do it again before it settles and it wakes up and chases you out.',
  ],
});
</script>
<script>window.PP_SCENE = { originY: 22, shadowX: .8, shadowY: -.5 };</script>
<script src="../engine.js"></script>
<script>
'use strict';

/* ---------- layout ---------- */
// x runs screen down-right, y runs screen down-left, z is up. The yard's back corner is at the top of the screen.
const TRUNK = { x: -3.6, y: -3.4 };
const CANOPY = { x: -3.4, y: -3.3, z: 5.4, rx: 3.8, ry: 3.8, rz: 2.3 };
const WALL = -9.2, WALL_H = 1.15, WALL_T = .45;
const COT = { x0: -.5, y0: -6.7, x1: 1.9, y1: -5.5, z: .58 };
const COT_Y = (COT.y0 + COT.y1) / 2;
const PUMP = { x: 5.6, y: 2.4 };
const PLAYER = { x: -5.4, y: 6.2 };
const BASKET = { x: -3.3, y: 7.5 };
const HOME = { x: -2.3, y: 6.9 };
const EXIT = { x: -9, y: 16 };
const DOG = { x: -6.6, y: -1.4, yaw: Math.PI * .75 }; // asleep in the tree's shade, side-on to the camera

const STONES = 15, MANGO_COUNT = 16, STALK = .42;
const GRAVITY = 12, ELEVATION = .88, MAX_SPEED = 15, RELEASE_Z = 2.1;
const MANGO_R = .3, HIT_R = .45, STONE_R = .12;
const NOISE_DECAY = .028, STIR_AT = .6;
const ROOST = 8; // birds living in the mango tree

/* ---------- palette ---------- */
const EARTH = [172, 128, 90];
const EARTH_TONES = [[160, 118, 84], [168, 125, 89], [176, 133, 95], [184, 141, 101]];
const PATH_TONES = [[190, 154, 112], [198, 162, 119], [206, 170, 126]];
const DRY_GRASS = [[128, 132, 64], [146, 146, 72], [164, 158, 84]];
const MUD = [[92, 72, 60], [104, 82, 66], [116, 92, 72]];
const DRY_LEAF = [[196, 150, 68], [150, 102, 58], [176, 120, 60]];
const PLASTER = [196, 160, 120], PLASTER_B = [186, 150, 112], CAP = [150, 112, 84], BRICK = [168, 84, 60];
const WOOD = [128, 86, 52], WOOD_DARK = [92, 62, 42], ROPE = [214, 190, 142], ROPE_GAP = [120, 90, 62];
const MANGO_BARK = [88, 76, 68];
const LEAF = [[20, 48, 34], [30, 64, 40], [44, 86, 48], [70, 114, 56], [114, 146, 66]];
const LEAF_FLUSH = [138, 140, 64]; // a few tips of pale new growth
const RIPE_TOP = [232, 116, 40], RIPE = [248, 186, 40], RIPE_LOW = [252, 212, 76];
const RAW_TOP = [92, 140, 52], RAW = [128, 170, 64];
const STALK_C = rgb(72, 70, 40);
const STONE_C = [150, 144, 136];
const CANE = [196, 156, 92], CANE_DARK = [164, 124, 70], CANE_RIM = [212, 176, 110], BASKET_FLOOR = rgb(96, 70, 44);
const VEST = [236, 232, 220], LUNGI = [58, 104, 136], LUNGI_B = [214, 210, 194];
const PUMP_C = [70, 104, 132], STEEL = [156, 160, 164], CONCRETE = [176, 170, 158];
const BOY = { shirt: [236, 234, 226], stripe: [236, 234, 226], legs: [46, 54, 88], knee: .8, hair: [30, 24, 22], skin: [176, 118, 82] };
const GIRL = { shirt: [208, 78, 90], stripe: [242, 222, 208], legs: [208, 78, 90], knee: .95, hair: [24, 20, 20], skin: [184, 128, 90] };
const UNCLE = { skin: [150, 100, 72], hair: [204, 200, 194] };
const WHITE = rgb(255, 255, 255);
const KIND_EARTH = 1, KIND_PATH = 2, KIND_MUD = 4;

/* ---------- ground ---------- */
function pathDistance(x, y) {
  // the worn path the kids use, from the gap in the hedge to the tree
  const pts = [[-8.6, 10.8], [-5.8, 5.4], [-4.4, 1.2], [-3.9, -1.4]];
  let best = Infinity;
  for (let k = 0; k < pts.length - 1; k++) {
    const [ax, ay] = pts[k], [bx, by] = pts[k + 1], dx = bx - ax, dy = by - ay;
    const t = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy), 0, 1);
    best = Math.min(best, Math.hypot(x - ax - dx * t, y - ay - dy * t));
  }
  return best;
}
function pickTone(tones, v, ix, iy) {
  return rgb(...tones[clamp(Math.floor(v * tones.length + (bayerAt(ix, iy) - .5) * .6), 0, tones.length - 1)]);
}
function groundColor(x, y, ix, iy, i) {
  const edge = Math.pow(Math.pow(Math.abs(x) / 10.6, 4) + Math.pow(Math.abs(y) / 10.6, 4), .25);
  const rough = edge + (noise(x * 1.3, y * 1.3) - .5) * .13;
  if (rough > 1.04) return 0;
  if (rough > .93 && hash(ix, iy) < (rough - .93) / .11) return 0;
  const fine = hash(ix, iy), pebble = fine > .978, pebbleShade = hash(ix - 1, iy - 1) > .978;
  const behind = x < WALL - WALL_T || y < WALL - WALL_T;

  const wet = Math.hypot(x - PUMP.x, y - PUMP.y - .7) + (noise(x * 2.5, y * 2.5) - .5) * .6;
  if (wet < 1.25) {
    kinds[i] = KIND_MUD;
    if (wet < .55 && fine > .55) return rgb(150, 168, 172); // a puddle catching the sky
    return pickTone(MUD, .35 + noise(x * 3, y * 3) * .5, ix, iy);
  }
  const tree = Math.hypot(x - TRUNK.x - .6, y - TRUNK.y + .3) + (noise(x * .8, y * .8) - .5) * 1.6;
  const path = pathDistance(x, y) + (noise(x * 2, y * 2) - .5) * .5;
  const wallFoot = !behind && Math.min(x - WALL, y - WALL) < .9 + noise(x * 1.7, y * 1.7) * .7;
  if (!behind && (tree < 4.8 || wallFoot)) {
    kinds[i] = KIND_EARTH;
    // years of fallen leaves under the tree
    if (tree < 4.4 && hash(ix * 3, iy * 7) > .955) return rgb(...DRY_LEAF[hash(ix, iy * 3) * 3 | 0]);
    if (pebble) return rampOf(EARTH)[4];
    if (pebbleShade) return rampOf(EARTH)[1];
    return pickTone(EARTH_TONES, .5 + (noise(x * .9, y * .9) - .5) * .8 - Math.max(0, 2 - tree) * .08, ix, iy);
  }
  if (!behind && path < .8) {
    kinds[i] = KIND_PATH;
    if (pebble) return rampOf(EARTH)[4];
    return pickTone(PATH_TONES, .45 + (noise(x * 1.2, y * 1.2) - .5) * .7 + (.8 - path) * .2, ix, iy);
  }
  kinds[i] = KIND_GRASS;
  const t = noise(x * .9, y * .9) * 1.15 + (fine - .5) * .55 - .08;
  if (noise(x * .35 + 7, y * .35 + 3) > .64) return pickTone(DRY_GRASS, t * .9, ix, iy); // summer: patches dry out
  return rgb(...GRASS[clamp(Math.floor(t * 4.2), 0, 3)]);
}

/* ---------- static props ---------- */
// a flat painted surface, for the charpai weave and the bucket's water
function slab(x0, y0, x1, y1, z, colorAt) {
  for (let a = x0; a <= x1; a += .045) for (let b = y0; b <= y1; b += .045) {
    const c = colorAt(a, b);
    if (!c) continue;
    const p = project(a, b, z), ix = p.sx | 0, iy = p.sy | 0;
    if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;
    const i = iy * W + ix;
    if (p.d <= zb[i]) continue;
    zb[i] = p.d;
    pix[i] = c;
  }
}
function buildWalls() {
  // the back wall along y = WALL, crumbling where it ends
  for (let x = WALL - WALL_T, n = 0; x < 4.6; x += 1.5, n++) {
    const top = WALL_H - (x > 2.4 ? (x - 2.4) * .3 : 0) - hash(n, 3) * .06;
    box(x, WALL - WALL_T, 0, Math.min(x + 1.5, 4.6), WALL, top, n % 2 ? PLASTER : PLASTER_B, n * 7);
    box(x, WALL - WALL_T - .04, top, Math.min(x + 1.5, 4.6), WALL + .04, top + .1, CAP, n);
  }
  // the side wall along x = WALL
  for (let y = WALL, n = 0; y < 3.6; y += 1.5, n++) {
    const top = WALL_H - (y > 1.6 ? (y - 1.6) * .3 : 0) - hash(n, 5) * .06;
    box(WALL - WALL_T, y, 0, WALL, Math.min(y + 1.5, 3.6), top, n % 2 ? PLASTER_B : PLASTER, n * 5 + 30);
    box(WALL - WALL_T - .04, y, top, WALL + .04, Math.min(y + 1.5, 3.6), top + .1, CAP, n + 20);
  }
  // plaster has fallen off in places, showing the bricks
  const bricks = (x0, z0, rows, along) => {
    for (let r = 0; r < rows; r++) for (let c = 0; c < 3 - (r % 2); c++) {
      const a = x0 + c * .36 + (r % 2) * .18, z = z0 + r * .16;
      if (along === 'x') box(a, WALL, z, a + .32, WALL + .03, z + .12, BRICK, r + c);
      else box(WALL, a, z, WALL + .03, a + .32, z + .12, BRICK, r + c);
    }
  };
  bricks(-6.2, .35, 3, 'x');
  bricks(.8, .5, 2, 'x');
  bricks(-4.2, .3, 3, 'y');
  // an earthen pot left on the wall
  const pot = [178, 94, 58];
  sphere(WALL - .22, -6.3, WALL_H + .42, .32, pot, 'rough');
  capsule([WALL - .22, -6.3, WALL_H + .62], [WALL - .22, -6.3, WALL_H + .78], .14, .16, () => pot, 'rough');
  for (let x = -9.4; x <= 4.4; x += .35) castShadow(x, WALL - .2, WALL_H, .35);
  for (let y = -9.2; y <= 3.4; y += .35) castShadow(WALL - .2, y, WALL_H, .35);
  castShadow(WALL - .22, -6.3, WALL_H + .4, .34);
}
function buildCot() {
  const { x0, y0, x1, y1, z } = COT;
  for (const [x, y] of [[x0, y0], [x1 - .14, y0], [x0, y1 - .14], [x1 - .14, y1 - .14]]) box(x, y, 0, x + .14, y + .14, z, WOOD_DARK, x * 9 | 0);
  box(x0, y0, z - .16, x1, y0 + .12, z, WOOD, 1);
  box(x0, y1 - .12, z - .16, x1, y1, z, WOOD, 2);
  box(x0, y0, z - .16, x0 + .12, y1, z, WOOD, 3);
  box(x1 - .12, y0, z - .16, x1, y1, z, WOOD, 4);
  // rope weave, with the shade under the cot showing through the gaps
  const light = rgb(...ROPE), dark = rgb(190, 164, 118), gap = rgb(...ROPE_GAP);
  slab(x0 + .12, y0 + .12, x1 - .12, y1 - .12, z - .05, (a, b) => {
    const u = (a + b) * 2.6, v = (a - b) * 2.6, fu = u - Math.floor(u), fv = v - Math.floor(v);
    if (fu < .55) return light;
    if (fv < .55) return dark;
    return gap;
  });
  // pillow at the head end, by the tree
  box(x0 + .16, y0 + .26, z - .05, x0 + .62, y1 - .26, z + .14, [228, 224, 212], 9);
  // his slippers, kicked off
  box(x0 + .9, y1 + .35, 0, x0 + 1.22, y1 + .5, .05, [116, 66, 44], 1);
  box(x0 + 1.3, y1 + .42, 0, x0 + 1.62, y1 + .57, .05, [116, 66, 44], 2);
  for (let x = x0; x <= x1; x += .3) for (let y = y0; y <= y1; y += .3) castShadow(x, y, z, .3);
}
function buildPump() {
  const { x, y } = PUMP;
  box(x - .55, y - .45, 0, x + .55, y + .45, .1, CONCRETE, 2);
  // the classic iron hand pump: a stand pipe, a boxy head, a spout and a long handle
  capsule([x, y, .1], [x, y, .9], .13, .13, () => PUMP_C, 'solid');
  box(x - .26, y - .22, .9, x + .26, y + .22, 1.32, PUMP_C, 4);
  box(x - .3, y - .26, 1.32, x + .3, y + .26, 1.4, [52, 80, 104], 5);
  capsule([x, y + .2, 1.08], [x, y + .62, 1.0], .08, .07, () => PUMP_C, 'solid');
  capsule([x - .26, y, 1.3], [x - 1.5, y, 1.36], .05, .05, () => [40, 54, 66], 'solid');
  capsule([x - 1.5, y, 1.36], [x - 1.7, y, 1.36], .07, .07, () => [40, 54, 66], 'solid');
  // a steel bucket under the spout
  capsule([x, y + .66, .18], [x, y + .66, .48], .22, .25, () => STEEL, 'gloss');
  slab(x - .22, y + .44, x + .22, y + .88, .5, (a, b) => Math.hypot(a - x, b - y - .66) < .2 ? rgb(84, 112, 124) : 0);
  for (let z = .2; z < 1.4; z += .2) castShadow(x, y, z, z > .9 ? .3 : .16);
  castShadow(x, y + .66, .35, .28);
  for (let a = .3; a < 1.7; a += .2) castShadow(x - a, y, 1.34, .08);
}
function buildSchoolThings() {
  // the school bag he dropped on the way in, and a steel tiffin
  box(-7.1, 4.7, 0, -6.4, 5.2, .45, [56, 72, 112], 3);
  box(-7.12, 4.68, .3, -6.38, 5.22, .47, [70, 88, 132], 4);
  capsule([-6.2, 5.6, .1], [-6.2, 5.6, .32], .16, .16, () => STEEL, 'gloss');
  castShadow(-6.75, 4.95, .3, .45);
  castShadow(-6.2, 5.6, .2, .18);
}

/* ---------- the mango tree ---------- */
const BRANCHES = [];
const LIMBS = [[-1.9, -.5, 3.8], [1.7, .6, 3.7], [.5, 1.8, 4], [-.6, -1.9, 4.2], [.1, .2, 4.8]];
function growMangoTree() {
  const T = TRUNK, bark = () => MANGO_BARK;
  const seg = (a, b, r0, r1, solid = true) => {
    capsule(a, b, r0, r1, bark, 'rough');
    if (solid) BRANCHES.push({ a, b, r: Math.max(r0, r1) });
    for (let k = 0; k <= 4; k++) {
      const t = k / 4;
      castShadow(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t), lerp(r0, r1, t) * .9);
    }
  };
  // roots flaring into the ground
  for (let k = 0; k < 5; k++) {
    const a = k * 1.26 + .4, c = Math.cos(a), s = Math.sin(a);
    seg([T.x + c * 1.05, T.y + s * 1.05, .02], [T.x + c * .25, T.y + s * .25, .55], .1, .3, false);
  }
  const top = [T.x + .1, T.y + .05, 1.8];
  seg([T.x, T.y, 0], top, .52, .4);
  for (const [dx, dy, z] of LIMBS) {
    const end = [T.x + dx, T.y + dy, z];
    seg(top, end, .3, .17);
    const len = Math.hypot(dx, dy) || 1;
    for (const turn of [-.7, .7]) {
      const c = Math.cos(turn), s = Math.sin(turn), ux = dx / len, uy = dy / len;
      seg(end, [end[0] + (ux * c - uy * s) * 1.2, end[1] + (ux * s + uy * c) * 1.2, z + .8], .15, .08);
    }
  }
  // a dense dome of leaf clusters, lit from the upper left, darker inside
  const L = [-.61, .41, .68];
  for (let k = 0; k < 1100; k++) {
    const a = hash(k, 1) * 6.283, nz = hash(k, 2) * 2 - 1, flat = Math.sqrt(1 - nz * nz);
    const nx = Math.cos(a) * flat, ny = Math.sin(a) * flat;
    const depth = 1 - Math.pow(hash(k, 3), 2.2) * .6;
    if (nz * depth < -.62) continue; // the crown's underside is fairly flat
    const lump = .86 + .28 * noise(nx * 1.6 + 5, ny * 1.6 + nz * 1.6 + 5);
    const ox = nx * depth * lump * CANOPY.rx, oy = ny * depth * lump * CANOPY.ry, oz = nz * depth * lump * CANOPY.rz;
    const lit = nx * L[0] + ny * L[1] + nz * L[2];
    const tone = .45 + lit * .5 * depth + (hash(k, 4) - .5) * .5 - (1 - depth) * .7;
    const color = hash(k, 5) < .012 && nz > .5 ? LEAF_FLUSH : LEAF[clamp(Math.floor(tone * 4.4), 0, 4)];
    const x = CANOPY.x + ox, y = CANOPY.y + oy, z = CANOPY.z + oz;
    capture = [];
    sphere(x, y, z, (color === LEAF_FLUSH ? .2 : .26) + hash(k, 6) * .22, color, 'rough');
    leaves.push({ x, y, z, k, r: .5, pixels: capture });
    capture = null;
  }
}
const inCanopy = (x, y, z) =>
  ((x - CANOPY.x) / CANOPY.rx) ** 2 + ((y - CANOPY.y) / CANOPY.ry) ** 2 + ((z - CANOPY.z) / CANOPY.rz) ** 2 < 1;

/* ---------- bake ---------- */
const leafZ = new Float32Array(W * H);
function bake() {
  zb.fill(-1e9);
  pix.fill(WHITE);
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundColor(g.x, g.y, ix, iy, i);
    if (!c) continue;
    pix[i] = c; ground[i] = 1;
    zb[i] = (g.x + g.y) / R2 * COS;
  }
  growGrass();
  groundZ.set(zb);
  buildWalls();
  buildCot();
  buildPump();
  buildSchoolThings();
  growMangoTree();
  bakeOcclusion();
  staticShadow.set(shadowMask);
  applyShadows(groundZ);
  bakedPix.set(pix);
  bakedZ.set(zb);
  // where the leaves sit in depth, so mangoes only hang where you can see them
  leafZ.fill(-1e9);
  for (const leaf of leaves) for (let n = 0; n < leaf.pixels.length; n += 4) {
    const i = leaf.pixels[n + 1] * W + leaf.pixels[n];
    if (leaf.pixels[n + 2] > leafZ[i]) leafZ[i] = leaf.pixels[n + 2];
  }
}
function hangMangoes() {
  const list = [], toCot = [.85, -.52];
  for (let tries = 0; list.length < MANGO_COUNT && tries < 6000; tries++) {
    const a = Math.random() * 6.283, el = .1 - Math.random() * .85;
    const nx = Math.cos(a) * Math.cos(el), ny = Math.sin(a) * Math.cos(el), nz = Math.sin(el);
    if (nx + ny < -.2) continue; // the far side of the crown
    const shell = .96 + Math.random() * .1;
    const hx = CANOPY.x + nx * CANOPY.rx * shell, hy = CANOPY.y + ny * CANOPY.ry * shell, hz = CANOPY.z + nz * CANOPY.rz * shell;
    if (list.some(m => Math.hypot(m.hx - hx, m.hy - hy, m.hz - hz) < .85)) continue;

// one dog "woof": a puff of breath, then a short gruff bark that drops in pitch
let growlCurve = null;

  osc.frequency.exponentialRampToValueAtTime(190 * pitch, t + dur);

function barks(n, vol, pitch, when = 0) {

function sound(kind, amount = .6, pan = 0) {
  if (!audio) return;
  bus = busFor(pan);
  if (kind === 'whoosh') hiss(.2, .07, 700, 1.4);
  else if (kind === 'rustle') { hiss(.25, .06 * amount + .03, 3600, .7, 'highpass'); hiss(.18, .04, 1900, 2, 'bandpass', .06); }
  else if (kind === 'snap') tone(1900, 1100, .035, .1, 'square');
  else if (kind === 'tok') { tone(560, 300, .08, .2 * amount + .07, 'triangle'); hiss(.04, .07, 1500, 3); }
  else if (kind === 'thump') { tone(140, 60, .15, .32 * amount + .1); hiss(.07, .05, 500, 1); }
  else if (kind === 'thud') tone(230, 110, .06, .12 * amount + .03);
  else if (kind === 'clack') { tone(1300, 650, .05, .14, 'square'); hiss(.05, .07, 2600, 2); }
  else if (kind === 'creak') { tone(250, 180, .25, .06, 'sawtooth'); tone(320, 260, .15, .03, 'sawtooth', .08); }
  else if (kind === 'pop') { tone(520, 760, .07, .09, 'triangle'); tone(780, 1050, .08, .07, 'triangle', .06); }
  else if (kind === 'grunt') tone(130, 92, .4, .09, 'sawtooth');
  else if (kind === 'bonk') { tone(420, 180, .12, .2, 'square'); }
  else if (kind === 'shout') { tone(300, 450, .14, .14, 'square'); tone(450, 280, .34, .14, 'square', .14); }
  else if (kind === 'snore') { hiss(1.1, .035, 260, 1.5, 'lowpass'); tone(68, 58, 1.1, .02, 'sawtooth'); }
  else if (kind === 'evening') [523, 659, 784, 1046].forEach((f, k) => tone(f, f * 1.002, .35, .06, 'triangle', k * .14));
  // the yard crow: an idle "caa caa", or the full startled "caa caa caa", a little higher
  else if (kind === 'caw') {
    const n = 1 + (Math.random() < .6) + (Math.random() < .25);
    calls('crow', CROW_CALLS, n, amount * 1.3, 1, .25) || caws(n + 1, CAW_VOL * amount, 1);
  }
  else if (kind === 'alarm') play('crow', { offset: .2, dur: 1.8, vol: 1.2, rate: 1.08 }) || caws(4, CAW_VOL * 1.1, 1.08, .24);
  // the yard dog: one or two woofs at a time
  else if (kind === 'bark') calls('dog', DOG_BARKS, Math.random() < .5 ? 2 : 1, 1, 1, .12) || barks(Math.random() < .5 ? 2 : 1, BARK_VOL, 1);
  else if (kind === 'growl') growl(BARK_VOL * .5);
  else if (kind === 'yelp') { tone(900, 1500, .1, .08, 'triangle'); tone(1300, 900, .14, .06, 'triangle', .09); }
  // a flock bursting out of the tree
  else if (kind === 'flock') play('flock', { vol: amount * 1.4, rate: .95 + Math.random() * .1 }) || hiss(.9, .06, 2400, .8, 'bandpass');
  // the neighbourhood: crows in other trees, dogs down the lane, sometimes another dog answering
  else if (kind === 'far-crows') {
    bus = busFor(pan, 1 + (Math.random() < .5));
    const n = 1 + (Math.random() * 3 | 0), rate = .88 + Math.random() * .2;
    calls('crow', CROW_CALLS, n, .5, rate, .3) || caws(n + 1, CAW_VOL * .55, rate, .32 + Math.random() * .12);
  }
  else if (kind === 'far-dogs') {
    const rate = .8 + Math.random() * .35, n = 2 + (Math.random() * 2 | 0);
    bus = busFor(pan, 2);
    calls('dog', DOG_BARKS, n, .8, rate, .25) || barks(n, BARK_VOL * .6, rate);
    if (Math.random() < .45) {
      bus = busFor(-pan, 2);
      const answer = rate * (1.12 + Math.random() * .2);
      if (samples.dog) setTimeout(() => { bus = busFor(-pan, 2); calls('dog', DOG_BARKS, 2, .6, answer, .2); }, 1400);
      else barks(2, BARK_VOL * .45, answer, 1.3);
    }
  }
  else if (kind === 'koel') {
    bus = busFor(pan, 1);
    // the koel: a rising two-note call, each one a little higher
    [0, 1, 2, 3].forEach(k => {
      const f = 640 + k * 70;
      tone(f, f * 1.04, .16, .07, 'sine', k * .62);
      tone(f * 1.06, f * 1.42, .3, .08, 'sine', k * .62 + .17);
    });
  }
}
const muteButton = document.getElementById('mute');
muteButton.addEventListener('click', () => {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 1;
  muteButton.textContent = muted ? 'sound off' : 'sound on';
  muteButton.setAttribute('aria-pressed', String(muted));
});
document.addEventListener('visibilitychange', () => {
  if (!audio) return;
  if (document.hidden) audio.suspend(); else audio.resume();
});

/* ---------- boot ---------- */
addEventListener('resize', fit);
fit();
bake();
reset();
let last = performance.now();
function frame(now) {
  update(Math.min(.04, (now - last) / 1000));
  last = now;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__mango = { G, reset, step(dt, skipDraw) { update(dt); if (!skipDraw) draw(); } };
